[project]
name = "wayka-backend"
version = "0.1.0"
description = "Wayka — Django + DRF backend (artisanal catering, Costa Rica)."
requires-python = ">=3.12,<3.13"

# ---------------------------------------------------------------------------
# Ruff — linter + import sorter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "**/migrations/*",
    "venv",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["E501"]
"**/test_*.py" = ["E501"]

# ---------------------------------------------------------------------------
# Black — formatter
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    migrations
  | venv
  | staticfiles
  | media
)/
'''

# ---------------------------------------------------------------------------
# pytest-django (available if/when we switch from manage.py test to pytest)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"
